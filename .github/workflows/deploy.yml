name: Deploy to GitHub Pages

# Builds the Vite production bundle and publishes dist/ to GitHub Pages.
#
# The blank page was caused by GitHub Pages being set to "Deploy from a
# branch". That mode runs GitHub's own `pages-build-deployment` job, which
# publishes the repository ROOT verbatim — including the source index.html,
# whose <script src="/src/main.jsx"> the browser cannot execute. This workflow
# built and uploaded dist/ correctly, but its artifact was never published
# because the branch publisher owned the site.
#
# `configure-pages` below runs with enablement, which switches the Pages
# source to "GitHub Actions" so this workflow's artifact is what goes live.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # enablement:true claims the Pages site for Actions. Without it, a repo
      # left on "Deploy from a branch" keeps publishing the source tree and
      # this workflow's artifact is built but never served.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          # This repo is a project site, served from /<repo>/ rather than the
          # domain root. Both values must match the Pages URL.
          VITE_BASE: /JMC-New-Build/
          VITE_SITE_URL: https://maxpc88.github.io/JMC-New-Build

      # Fails the run early if the build ever regresses to referencing source.
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          if grep -q "main.jsx" dist/index.html; then
            echo "::error::dist/index.html still references main.jsx"; exit 1
          fi
          grep -q "/JMC-New-Build/assets/" dist/index.html || {
            echo "::error::assets are not prefixed with the Pages base path"; exit 1
          }
          echo "dist/index.html references:"
          grep -Eo '(src|href)="[^"]*(assets|favicon)[^"]*"' dist/index.html

      - name: Upload dist as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
